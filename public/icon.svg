<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .bg { fill: #ffffff; stroke: #e2e8f0; }
    .icon { stroke: #0f172a; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #090d16; stroke: #1e293b; }
      .icon { stroke: #f8fafc; fill: #f8fafc; }
    }
  </style>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="18" class="bg" stroke-width="2" />
  
  <!-- Dual Interconnected Link Rings -->
  <rect x="8" y="20" width="30" height="20" rx="10" class="icon" fill="none" stroke-width="4" />
  <rect x="26" y="24" width="30" height="20" rx="10" class="icon" fill="none" stroke-width="4" />

  <!-- Center Node -->
  <circle cx="32" cy="32" r="3" class="icon" stroke="none" />
</svg>
